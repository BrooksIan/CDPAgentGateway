# Invoke from the repo root so .env and volume paths resolve:
#   docker compose --project-directory . -f deploy/docker-compose.yml up
# `make up` already does this.

services:
  mock-cdp:
    build: ./mock-cdp
    environment:
      JWKS_PATH: /keys/jwks.json
      PORT: "8080"
      KNOX_PROXY_PREFIX: ${KNOX_PROXY_PREFIX:-/gateway/cdp-proxy-token}
      MOCK_REVOKED_TOKEN_IDS: ${MOCK_REVOKED_TOKEN_IDS:-revoked-token-id}
    volumes:
      - ./conf/keys:/keys:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 2s
      timeout: 2s
      retries: 20

  mcp-spark:
    build: ./mcp-spark
    environment:
      PORT: "8080"
      UPSTREAM_SCHEME: ${UPSTREAM_SCHEME:-http}
      UPSTREAM_HOST: ${UPSTREAM_HOST:-mock-cdp}
      UPSTREAM_PORT: ${UPSTREAM_PORT:-8080}
      UPSTREAM_TLS_VERIFY: ${UPSTREAM_TLS_VERIFY:-false}
      KNOX_PROXY_PREFIX: ${KNOX_PROXY_PREFIX:-/gateway/cdp-proxy-token}
      ADMIN_URL: http://admin:8080
      ADMIN_INTERNAL_TOKEN: ${ADMIN_INTERNAL_TOKEN:-lab-admin}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 2s
      timeout: 2s
      retries: 20
    depends_on:
      mock-cdp:
        condition: service_healthy
      admin:
        condition: service_healthy

  mcp-hive:
    build: ./mcp-hive
    environment:
      PORT: "8080"
      GATEWAY_MODE: ${GATEWAY_MODE:-local}
      UPSTREAM_SCHEME: ${UPSTREAM_SCHEME:-http}
      UPSTREAM_HOST: ${UPSTREAM_HOST:-mock-cdp}
      UPSTREAM_PORT: ${UPSTREAM_PORT:-8080}
      UPSTREAM_TLS_VERIFY: ${UPSTREAM_TLS_VERIFY:-false}
      KNOX_PROXY_PREFIX: ${KNOX_PROXY_PREFIX:-/gateway/cdp-proxy-token}
      ADMIN_URL: http://admin:8080
      ADMIN_INTERNAL_TOKEN: ${ADMIN_INTERNAL_TOKEN:-lab-admin}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 2s
      timeout: 2s
      retries: 20
    depends_on:
      mock-cdp:
        condition: service_healthy
      admin:
        condition: service_healthy

  mcp-impala:
    build: ./mcp-impala
    environment:
      PORT: "8080"
      GATEWAY_MODE: ${GATEWAY_MODE:-local}
      UPSTREAM_SCHEME: ${UPSTREAM_SCHEME:-http}
      UPSTREAM_HOST: ${UPSTREAM_HOST:-mock-cdp}
      UPSTREAM_PORT: ${UPSTREAM_PORT:-8080}
      UPSTREAM_TLS_VERIFY: ${UPSTREAM_TLS_VERIFY:-false}
      KNOX_PROXY_PREFIX: ${KNOX_PROXY_PREFIX:-/gateway/cdp-proxy-token}
      IMPALA_HOST: ${IMPALA_HOST:-}
      IMPALA_PORT: ${IMPALA_PORT:-}
      IMPALA_SCHEME: ${IMPALA_SCHEME:-}
      IMPALA_HTTP_PATH: ${IMPALA_HTTP_PATH:-}
      IMPALA_TLS_VERIFY: ${IMPALA_TLS_VERIFY:-false}
      ADMIN_URL: http://admin:8080
      ADMIN_INTERNAL_TOKEN: ${ADMIN_INTERNAL_TOKEN:-lab-admin}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 2s
      timeout: 2s
      retries: 20
    depends_on:
      mock-cdp:
        condition: service_healthy
      admin:
        condition: service_healthy

  admin:
    build: ./admin
    environment:
      GATEWAY_MODE: ${GATEWAY_MODE:-local}
      UPSTREAM_HOST: ${UPSTREAM_HOST:-mock-cdp}
      MCP_RATE_COUNT: ${MCP_RATE_COUNT:-60}
      MCP_RATE_WINDOW: ${MCP_RATE_WINDOW:-60}
      APISIX_HEALTH_URL: http://apisix:9080/health
      MCP_SPARK_HEALTH_URL: http://mcp-spark:8080/health
      MCP_HIVE_HEALTH_URL: http://mcp-hive:8080/health
      MCP_IMPALA_HEALTH_URL: http://mcp-impala:8080/health
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:${ADMIN_PORT:-9090}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 2s
      timeout: 2s
      retries: 20

  apisix:
    image: apache/apisix:3.16.0-debian
    depends_on:
      mock-cdp:
        condition: service_healthy
      mcp-spark:
        condition: service_healthy
      mcp-hive:
        condition: service_healthy
      mcp-impala:
        condition: service_healthy
      admin:
        condition: service_healthy
    environment:
      APISIX_STAND_ALONE: "true"
    volumes:
      - ./conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./conf/generated/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ./conf/generated/knox-public.pem:/usr/local/apisix/conf/knox-public.pem:ro
      - ./plugins/knox-jwt.lua:/opt/custom/apisix/plugins/knox-jwt.lua:ro
    ports:
      - "${APISIX_PORT:-9080}:9080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  default:
    name: agent-gateway
