<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 160" role="img" aria-labelledby="title desc">
  <title id="title">CDP Agent Gateway traffic path</title>
  <desc id="desc">Third-party agents to APISIX to MCP adapters (Phase 2) to Apache Knox to Cloudera Data Platform Spark</desc>
  <style>
    .box { fill: #f4f4f5; stroke: #3f3f46; stroke-width: 1.5; }
    .box-gw { fill: #e4e4e7; stroke: #18181b; stroke-width: 2; }
    .label { font: 600 13px ui-sans-serif, system-ui, sans-serif; fill: #18181b; }
    .sub { font: 11px ui-sans-serif, system-ui, sans-serif; fill: #52525b; }
    .arrow { stroke: #52525b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#52525b"/>
    </marker>
  </defs>
  <rect class="box" x="8" y="36" width="160" height="72" rx="6"/>
  <text class="label" x="88" y="68" text-anchor="middle">3rd-party agents</text>
  <text class="sub" x="88" y="88" text-anchor="middle">Cursor, Claude, MCP</text>
  <line class="arrow" x1="168" y1="72" x2="198" y2="72"/>
  <rect class="box-gw" x="206" y="36" width="160" height="72" rx="6"/>
  <text class="label" x="286" y="68" text-anchor="middle">Agent Gateway</text>
  <text class="sub" x="286" y="88" text-anchor="middle">APISIX north-south</text>
  <line class="arrow" x1="366" y1="72" x2="396" y2="72"/>
  <rect class="box" x="404" y="36" width="160" height="72" rx="6"/>
  <text class="label" x="484" y="68" text-anchor="middle">MCP adapters</text>
  <text class="sub" x="484" y="88" text-anchor="middle">Phase 2 tools</text>
  <line class="arrow" x1="564" y1="72" x2="594" y2="72"/>
  <rect class="box" x="602" y="36" width="140" height="72" rx="6"/>
  <text class="label" x="672" y="68" text-anchor="middle">Apache Knox</text>
  <text class="sub" x="672" y="88" text-anchor="middle">JWT + Ranger</text>
  <line class="arrow" x1="742" y1="72" x2="772" y2="72"/>
  <rect class="box" x="780" y="36" width="128" height="72" rx="6"/>
  <text class="label" x="844" y="68" text-anchor="middle">CDP</text>
  <text class="sub" x="844" y="88" text-anchor="middle">Spark / Livy</text>
</svg>
