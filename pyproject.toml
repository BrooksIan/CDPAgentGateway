[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdp-agent-gateway"
version = "0.1.0"
description = "Operator CLI for the CDP Agent Gateway blueprint"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "httpx",
  "PyJWT",
  "cryptography",
  "python-dotenv",
  "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest", "starlette", "uvicorn"]
amp = ["starlette", "uvicorn"]
hive = ["impyla>=0.19"]

[project.scripts]
gateway = "agentgateway.cli:main"
ag = "agentgateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
