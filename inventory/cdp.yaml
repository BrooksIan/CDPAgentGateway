# Phase 0 inventory — fill before pointing the local gateway at a real CDP.
# Tests assert this schema. Secrets stay in .env, not here.

environment:
  name: go01-obser-de
  deployment: public-cloud  # private-cloud-base | public-cloud
  notes: Laptop APISIX (Compose) in front of Public Cloud Knox. Secrets stay in .env.

knox:
  issuer: KNOXSSO
  expected_alg: RS256
  topology: cdp-proxy-token
  proxy_prefix: /go01-obser-de/cdp-proxy-token
  jwks_path: /go01-obser-de/homepage/knoxtoken/api/v2/jwks.json
  token_api: /go01-obser-de/homepage/knoxtoken/api/v2/token
  gateway_url: "https://go01-obser-de-gateway.go01-dem.ylcu-atmi.cloudera.site"
  jwks_url: "https://go01-obser-de-gateway.go01-dem.ylcu-atmi.cloudera.site/go01-obser-de/homepage/knoxtoken/api/v2/jwks.json"
  tls_verify: false

identity:
  user_claim: sub
  token_id_claim: knox.id
  groups_claim: knox.groups
  managed_claim: managed.token
  agent_identity: separate-from-user  # mTLS or caller key later

first_tools:
  - id: livy-spark3-sessions
    method: GET
    path: /livy_for_spark3/sessions
    access: read
    purpose: List Livy for Spark 3 sessions through Knox. Phase 1 probe.
  - id: livy-spark3-batches
    method: GET
    path: /livy_for_spark3/batches
    access: read
    purpose: List Livy for Spark 3 batches. MCP spark_list_batches uses this path.
  - id: hive-mcp-databases
    method: POST
    path: /mcp/hive
    access: read
    purpose: Read-only Hive MCP (list databases/tables, describe, capped select). /cdp/hive stays 404.
  - id: impala-mcp-databases
    method: POST
    path: /mcp/impala
    access: read
    purpose: Read-only Impala MCP (list databases/tables, describe, capped select). CDW coordinator via IMPALA_HOST or Knox /impala. /cdp/impala stays 404.
  - id: webhdfs-list
    method: GET
    path: /cdp/webhdfs/v1/
    access: read
    purpose: List HDFS through Knox WebHDFS on the gateway. Operator staging for Spark file URIs.

threats:
  - id: missing-auth
    control: reject-401
  - id: alg-none
    control: reject-401
  - id: hmac-confusion
    control: reject-401
  - id: expired-token
    control: reject-401
  - id: wrong-issuer
    control: reject-401
  - id: direct-knox-bypass
    control: do-not-publish-cdp-apis
